version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: barbtech_db
    restart: always
    environment:
      POSTGRES_DB: barbtech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
