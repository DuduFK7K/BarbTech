version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: barbtech_db
    restart: always
    environment:
      MYSQL_DATABASE: barbtech
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
